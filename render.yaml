services:
  - type: web
    name: gokul-hrm-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies are needed at build time for the TypeScript compiler.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once by Render; never committed.
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string (set in the Render dashboard).
      - key: MONGODB_URI
        sync: false
      # Your Vercel URL, e.g. https://gokul-hrm.vercel.app (no trailing slash).
      - key: CORS_ORIGIN
        sync: false
      # Used once on first boot to create the initial Admin if none exists.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
